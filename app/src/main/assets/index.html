<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#ffffff">

    <title>ESP TopUp</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
        }

        #website {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            display: block;
            background: #ffffff;
        }
    </style>
</head>

<body>

    <iframe
        id="website"
        src="about:blank"
        frameborder="0"
        allowfullscreen
        allow="
            fullscreen;
            autoplay;
            camera;
            microphone;
            geolocation;
            clipboard-read;
            clipboard-write;
            payment;
            web-share">
    </iframe>


    <script type="module">

        /* =====================================================
           FIREBASE
        ===================================================== */

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


        /* =====================================================
           FIREBASE CONFIG
        ===================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyA3B7DZ_JeY-a33zdixKmZ6oQrU2iEVsEk",

            authDomain:
                "samim-firebase.firebaseapp.com",

            projectId:
                "samim-firebase",

            storageBucket:
                "samim-firebase.firebasestorage.app",

            messagingSenderId:
                "521003542655",

            appId:
                "1:521003542655:web:bbabcf2f24a0eaeeef774a",

            measurementId:
                "G-SPBMDSXJVX"
        };


        /* =====================================================
           SETTINGS
        ===================================================== */

        const DEFAULT_URL =
            "https://esptopup.github.io/com/";

        const CACHE_KEY =
            "esp_user_website_url";


        /* =====================================================
           WEBSITE
        ===================================================== */

        const website =
            document.getElementById(
                "website"
            );


        let currentUrl = "";


        /* =====================================================
           URL NORMALIZER
        ===================================================== */

        function normalizeUrl(value) {

            if (
                typeof value !== "string"
            ) {
                return null;
            }

            value =
                value.trim();

            if (!value) {
                return null;
            }

            if (
                !/^https?:\/\//i.test(value)
            ) {

                value =
                    "https://" + value;

            }

            try {

                const url =
                    new URL(value);

                if (
                    url.protocol !== "https:" &&
                    url.protocol !== "http:"
                ) {
                    return null;
                }

                return url.href;

            } catch {

                return null;

            }
        }


        /* =====================================================
           FAST LOAD
        ===================================================== */

        function loadWebsite(value) {

            const url =
                normalizeUrl(value);

            if (!url) {
                return;
            }


            /*
             * একই URL হলে আবার reload নয়।
             */

            if (
                currentUrl === url
            ) {
                return;
            }


            currentUrl =
                url;


            /*
             * পরেরবার app দ্রুত খোলার জন্য
             * URL locally save করা হচ্ছে।
             */

            try {

                localStorage.setItem(
                    CACHE_KEY,
                    url
                );

            } catch (error) {

                console.warn(
                    "Local cache unavailable"
                );

            }

            // Sync with Native Android Bridge if available
            try {
                if (window.AndroidBridge && typeof window.AndroidBridge.onUrlLoaded === "function") {
                    window.AndroidBridge.onUrlLoaded(url);
                }
            } catch (e) {
                console.warn("AndroidBridge sync error", e);
            }

            /*
             * কোনো delay ছাড়াই website load।
             */

            website.src =
                url;

        }

        // Expose loadWebsite globally so Android native code can also trigger it directly if needed
        window.loadWebsite = loadWebsite;


        /* =====================================================
           INSTANT CACHED URL
        ===================================================== */

        let cachedUrl = null;

        try {

            cachedUrl =
                localStorage.getItem(
                    CACHE_KEY
                );

        } catch (error) {

            cachedUrl = null;

        }

        // If localStorage didn't have it, check native bridge cache
        if (!cachedUrl && window.AndroidBridge && typeof window.AndroidBridge.getCachedUrl === "function") {
            try {
                const nativeCached = window.AndroidBridge.getCachedUrl();
                if (nativeCached && nativeCached.length > 0) {
                    cachedUrl = nativeCached;
                }
            } catch (e) {
                console.warn("Failed reading native cache", e);
            }
        }


        if (cachedUrl) {

            loadWebsite(
                cachedUrl
            );

        } else {

            /*
             * প্রথমবার app চালু হলে
             * default website।
             */

            loadWebsite(
                DEFAULT_URL
            );

        }


        /* =====================================================
           FIREBASE INITIALIZATION
        ===================================================== */

        let database = null;

        try {

            const app =
                initializeApp(
                    firebaseConfig
                );

            database =
                getDatabase(
                    app
                );

        } catch (error) {

            console.error(
                "Firebase initialization error:",
                error
            );

        }


        /* =====================================================
           REALTIME WEBSITE URL
        ===================================================== */

        if (database) {

            const websiteUrlRef =
                ref(
                    database,
                    "websiteUrl"
                );


            onValue(

                websiteUrlRef,

                function(snapshot) {

                    const value =
                        snapshot.val();


                    if (
                        typeof value ===
                        "string"
                        &&
                        value.trim() !== ""
                    ) {

                        loadWebsite(
                            value
                        );

                    }

                },

                function(error) {

                    console.error(
                        "Firebase realtime error:",
                        error
                    );

                }

            );

        }


        /* =====================================================
           GOOGLE AUTH POPUP / EXTERNAL BROWSER HANDLER
        ===================================================== */

        window.addEventListener("message", function(event) {
            if (event.data && event.data.action === "open_google_auth") {
                const authUrl = "https://esptopup.github.io/com/google-auth.html";
                if (window.AndroidBridge && typeof window.AndroidBridge.openGoogleAuth === "function") {
                    window.AndroidBridge.openGoogleAuth(authUrl);
                } else {
                    window.open(authUrl, "_system");
                }
            }
        });


        /* =====================================================
           NETWORK
        ===================================================== */

        window.addEventListener(
            "online",
            function() {

                console.log(
                    "Internet connected"
                );

            }
        );


        window.addEventListener(
            "offline",
            function() {

                console.log(
                    "Internet disconnected"
                );

            }
        );


        /* =====================================================
           APP RETURN
        ===================================================== */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    console.log(
                        "User App active"
                    );

                }

            }
        );

    </script>

</body>

</html>
